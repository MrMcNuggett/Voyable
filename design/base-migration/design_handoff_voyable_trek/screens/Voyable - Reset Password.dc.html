<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<helmet>
  <link rel="stylesheet" href="_ds/voyable-design-system-20d63b1d-fb41-47b0-8049-741c2094f669/tokens/fonts.css">
  <link rel="stylesheet" href="_ds/voyable-design-system-20d63b1d-fb41-47b0-8049-741c2094f669/tokens/colors.css">
  <link rel="stylesheet" href="_ds/voyable-design-system-20d63b1d-fb41-47b0-8049-741c2094f669/tokens/typography.css">
  <link rel="stylesheet" href="_ds/voyable-design-system-20d63b1d-fb41-47b0-8049-741c2094f669/tokens/spacing.css">
  <link rel="stylesheet" href="_ds/voyable-design-system-20d63b1d-fb41-47b0-8049-741c2094f669/tokens/effects.css">
  <link rel="stylesheet" href="_ds/voyable-design-system-20d63b1d-fb41-47b0-8049-741c2094f669/styles.css">
  <script src="_ds/voyable-design-system-20d63b1d-fb41-47b0-8049-741c2094f669/_ds_bundle.js"></script>
  <style>html,body{margin:0;background:var(--surface-page);}*{box-sizing:border-box;}</style>
</helmet>

<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;font-family:var(--font-sans);">
  <div style="width:100%;max-width:440px;background:var(--surface-raised);border:1px solid var(--border-subtle);border-radius:var(--radius-xl);padding:34px 30px;box-shadow:var(--shadow-md);">

    <sc-if value="{{ isSuccess }}" hint-placeholder-val="{{ false }}">
      <div style="text-align:center;padding:8px 0;">
        <div style="width:56px;height:56px;border-radius:50%;background:var(--state-success-subtle);display:inline-flex;align-items:center;justify-content:center;color:var(--success-500);margin-bottom:16px;">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="M22 4L12 14.01l-3-3"/></svg>
        </div>
        <h1 style="font-family:var(--font-display);font-size:var(--text-2xl);font-weight:700;color:var(--text-primary);margin:0 0 10px;">Password reset</h1>
        <p style="font-size:var(--text-sm);color:var(--text-secondary);line-height:var(--leading-relaxed);margin:0 0 24px;">Your password has been changed. Sign in with your new password.</p>
        <x-import component-from-global-scope="VoyableDesignSystem_20d63b.Button" hint-size="auto,44px">Sign in</x-import>
      </div>
    </sc-if>

    <sc-if value="{{ !isSuccess }}" hint-placeholder-val="{{ true }}">
      <h1 style="font-family:var(--font-display);font-size:var(--text-2xl);font-weight:700;color:var(--text-primary);margin:0 0 8px;">Set a new password</h1>
      <p style="font-size:var(--text-sm);color:var(--text-secondary);line-height:var(--leading-relaxed);margin:0 0 24px;">{{ subtitle }}</p>

      <form onsubmit="{{ submit }}" style="display:flex;flex-direction:column;gap:16px;">
        <sc-if value="{{ !mfaRequired }}" hint-placeholder-val="{{ true }}">
          <x-import component-from-global-scope="VoyableDesignSystem_20d63b.Input" hint-size="100%,46px" label="New password" type="password" placeholder="••••••••"></x-import>
          <x-import component-from-global-scope="VoyableDesignSystem_20d63b.Input" hint-size="100%,46px" label="Confirm new password" type="password" placeholder="••••••••"></x-import>
        </sc-if>
        <sc-if value="{{ mfaRequired }}" hint-placeholder-val="{{ false }}">
          <x-import component-from-global-scope="VoyableDesignSystem_20d63b.Input" hint-size="100%,46px" label="Two-factor code" placeholder="123456 or backup code"></x-import>
        </sc-if>
        <x-import component-from-global-scope="VoyableDesignSystem_20d63b.Button" hint-size="100%,44px" style="width:100%;margin-top:4px;">{{ submitLabel }}</x-import>
      </form>
    </sc-if>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { isSuccess: false, mfaRequired: false };
  renderVals() {
    return {
      isSuccess: this.state.isSuccess,
      mfaRequired: this.state.mfaRequired,
      subtitle: this.state.mfaRequired ? 'Enter the code from your authenticator app to finish resetting your password.' : 'Choose a new password for your account.',
      submitLabel: this.state.mfaRequired ? 'Verify' : 'Reset password',
      submit: (e) => { e.preventDefault(); this.setState({ isSuccess: true }); },
    };
  }
}
</script>
</body>
</html>
