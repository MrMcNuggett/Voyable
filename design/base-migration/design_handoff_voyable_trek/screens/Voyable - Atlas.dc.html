<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<helmet>
  <link rel="stylesheet" href="_ds/voyable-design-system-20d63b1d-fb41-47b0-8049-741c2094f669/tokens/fonts.css">
  <link rel="stylesheet" href="_ds/voyable-design-system-20d63b1d-fb41-47b0-8049-741c2094f669/tokens/colors.css">
  <link rel="stylesheet" href="_ds/voyable-design-system-20d63b1d-fb41-47b0-8049-741c2094f669/tokens/typography.css">
  <link rel="stylesheet" href="_ds/voyable-design-system-20d63b1d-fb41-47b0-8049-741c2094f669/tokens/spacing.css">
  <link rel="stylesheet" href="_ds/voyable-design-system-20d63b1d-fb41-47b0-8049-741c2094f669/tokens/effects.css">
  <link rel="stylesheet" href="_ds/voyable-design-system-20d63b1d-fb41-47b0-8049-741c2094f669/styles.css">
  <script src="_ds/voyable-design-system-20d63b1d-fb41-47b0-8049-741c2094f669/_ds_bundle.js"></script>
  <style>
    html,body{margin:0;height:100%;background:var(--surface-page);}
    *{box-sizing:border-box;}
    .mono{font-family:var(--font-mono);font-feature-settings:"tnum";}
  </style>
</helmet>

<div style="height:100vh;display:flex;flex-direction:column;overflow:hidden;font-family:var(--font-sans);color:var(--text-primary);">
  <nav style="height:64px;flex-shrink:0;display:flex;align-items:center;padding:0 24px;gap:10px;background:color-mix(in oklch, var(--surface-raised) 92%, transparent);backdrop-filter:blur(16px);border-bottom:1px solid var(--border-subtle);z-index:30;">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="11" fill="var(--petrol-500)"/><path d="M12 6c-2.2 0-4 1.7-4 4 0 3 4 8 4 8s4-5 4-8c0-2.3-1.8-4-4-4Zm0 5.5A1.5 1.5 0 1 1 12 8.5a1.5 1.5 0 0 1 0 3Z" fill="var(--stone-50)"/></svg>
    <span style="font-family:var(--font-display);font-weight:700;font-size:var(--text-xl);letter-spacing:-0.01em;">voyable</span>
  </nav>

  <div style="flex:1;position:relative;overflow:hidden;">
    <!-- Flat placeholder standing in for the world map -->
    <div style="position:absolute;inset:0;background:linear-gradient(160deg, var(--stone-200) 0%, var(--olive-100) 55%, var(--stone-200) 100%);"></div>
    <div style="position:absolute;left:22%;top:32%;width:14px;height:14px;border-radius:50%;background:var(--accent-route);box-shadow:0 0 0 5px color-mix(in oklch, var(--accent-route) 20%, transparent);"></div>
    <div style="position:absolute;left:48%;top:24%;width:14px;height:14px;border-radius:50%;background:var(--accent-route);box-shadow:0 0 0 5px color-mix(in oklch, var(--accent-route) 20%, transparent);"></div>
    <div style="position:absolute;left:63%;top:45%;width:14px;height:14px;border-radius:50%;background:var(--accent-route);box-shadow:0 0 0 5px color-mix(in oklch, var(--accent-route) 20%, transparent);"></div>
    <div style="position:absolute;left:33%;top:58%;width:14px;height:14px;border-radius:50%;background:var(--accent-route);box-shadow:0 0 0 5px color-mix(in oklch, var(--accent-route) 20%, transparent);"></div>
    <div style="position:absolute;left:78%;top:60%;width:14px;height:14px;border-radius:50%;background:var(--accent-route);box-shadow:0 0 0 5px color-mix(in oklch, var(--accent-route) 20%, transparent);"></div>
    <div style="position:absolute;top:20px;left:24px;font-size:12px;color:var(--text-muted);background:color-mix(in oklch, var(--surface-raised) 85%, transparent);backdrop-filter:blur(10px);padding:6px 12px;border-radius:999px;border:1px solid var(--border-subtle);">Amber pins mark countries you've visited</div>

    <!-- Floating stats panel -->
    <div style="position:absolute;left:50%;bottom:20px;transform:translateX(-50%);background:color-mix(in oklch, var(--surface-raised) 82%, transparent);backdrop-filter:blur(24px) saturate(1.6);border:1px solid var(--border-subtle);border-radius:22px;box-shadow:var(--shadow-lg);max-width:calc(100vw - 48px);overflow:hidden;">

      <div style="display:flex;gap:4px;padding:12px 16px 0;">
        <button onclick="{{ setTabStats }}" style="flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:7px 18px;border-radius:10px;border:none;font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;background:{{ statsBg }};color:{{ statsFg }};">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20 15 15 0 0 1 0-20"/></svg>
          Stats
        </button>
        <button onclick="{{ setTabBucket }}" style="flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:7px 18px;border-radius:10px;border:none;font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;background:{{ bucketBg }};color:{{ bucketFg }};">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          Bucket list
        </button>
      </div>

      <sc-if value="{{ isStats }}" hint-placeholder-val="{{ true }}">
        <div style="display:flex;align-items:center;justify-content:center;padding:8px;overflow-x:auto;max-width:calc(100vw - 80px);">
          <div style="display:flex;align-items:baseline;gap:8px;padding:16px 20px;margin:8px;border-radius:16px;background:var(--surface-sunken);">
            <span class="mono" style="font-size:42px;font-weight:800;line-height:1;">14</span>
            <span style="font-size:13px;font-weight:500;color:var(--text-muted);">countries</span>
          </div>
          <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px 14px;">
            <span class="mono" style="font-size:24px;font-weight:800;line-height:1;">8</span>
            <span style="font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-muted);margin-top:6px;">trips</span>
          </div>
          <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px 14px;">
            <span class="mono" style="font-size:24px;font-weight:800;line-height:1;">54</span>
            <span style="font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-muted);margin-top:6px;">places</span>
          </div>
          <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px 14px;">
            <span class="mono" style="font-size:24px;font-weight:800;line-height:1;">21</span>
            <span style="font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-muted);margin-top:6px;">cities</span>
          </div>
          <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px 14px;">
            <span class="mono" style="font-size:24px;font-weight:800;line-height:1;">47</span>
            <span style="font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-muted);margin-top:6px;">days</span>
          </div>

          <div style="width:1.5px;background:var(--border-subtle);margin:12px 8px;"></div>

          <div style="display:flex;align-items:center;gap:18px;padding:16px 10px;">
            <div style="display:flex;flex-direction:column;align-items:center;"><span class="mono" style="font-size:20px;font-weight:800;line-height:1;">6</span><span style="font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-muted);margin-top:6px;">Europe</span></div>
            <div style="display:flex;flex-direction:column;align-items:center;"><span class="mono" style="font-size:20px;font-weight:800;line-height:1;">4</span><span style="font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-muted);margin-top:6px;">Asia</span></div>
            <div style="display:flex;flex-direction:column;align-items:center;"><span class="mono" style="font-size:20px;font-weight:800;line-height:1;color:var(--border-default);">0</span><span style="font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:var(--border-default);margin-top:6px;">N. America</span></div>
            <div style="display:flex;flex-direction:column;align-items:center;"><span class="mono" style="font-size:20px;font-weight:800;line-height:1;">2</span><span style="font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-muted);margin-top:6px;">S. America</span></div>
            <div style="display:flex;flex-direction:column;align-items:center;"><span class="mono" style="font-size:20px;font-weight:800;line-height:1;color:var(--border-default);">0</span><span style="font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:var(--border-default);margin-top:6px;">Africa</span></div>
            <div style="display:flex;flex-direction:column;align-items:center;"><span class="mono" style="font-size:20px;font-weight:800;line-height:1;">2</span><span style="font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-muted);margin-top:6px;">Oceania</span></div>
          </div>

          <div style="width:1.5px;background:var(--border-subtle);margin:12px 8px;"></div>

          <div style="display:flex;align-items:center;gap:16px;padding:16px 18px 16px 10px;flex-shrink:0;">
            <div style="max-width:120px;">
              <div style="font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-muted);white-space:nowrap;">Last trip</div>
              <div style="font-size:13px;font-weight:700;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">Portugal Road Trip</div>
            </div>
            <div style="display:flex;flex-direction:column;align-items:center;flex-shrink:0;">
              <span class="mono" style="font-size:20px;font-weight:800;line-height:1;">3</span>
              <span style="font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-muted);margin-top:6px;white-space:nowrap;">years in a row</span>
            </div>
          </div>
        </div>
      </sc-if>

      <sc-if value="{{ !isStats }}" hint-placeholder-val="{{ false }}">
        <div style="padding:8px 16px 16px;">
          <div style="display:flex;gap:10px;overflow-x:auto;padding:8px 4px;">
            <div style="display:flex;flex-direction:column;align-items:center;min-width:84px;padding:10px 14px;border-radius:14px;background:var(--surface-sunken);">
              <div style="width:28px;height:20px;border-radius:4px;background:var(--olive-300);margin-bottom:6px;"></div>
              <span style="font-size:12px;font-weight:600;text-align:center;">New Zealand</span>
              <span style="font-size:10px;color:var(--text-muted);margin-top:2px;">Mar 2027</span>
            </div>
            <div style="display:flex;flex-direction:column;align-items:center;min-width:84px;padding:10px 14px;border-radius:14px;background:var(--surface-sunken);">
              <div style="width:28px;height:20px;border-radius:4px;background:var(--petrol-300);margin-bottom:6px;"></div>
              <span style="font-size:12px;font-weight:600;text-align:center;">Morocco</span>
              <span style="font-size:10px;color:var(--text-muted);margin-top:2px;">Not planned yet</span>
            </div>
            <div style="display:flex;flex-direction:column;align-items:center;min-width:84px;padding:10px 14px;border-radius:14px;background:var(--surface-sunken);">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="var(--olive-400)" stroke="var(--olive-400)" style="margin-bottom:6px;"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
              <span style="font-size:12px;font-weight:600;text-align:center;">Patagonia trek</span>
              <span style="font-size:10px;color:var(--text-muted);margin-top:2px;">Nov 2026</span>
            </div>
          </div>
          <button onclick="{{ toggleAdd }}" style="margin-top:8px;width:100%;display:flex;align-items:center;justify-content:center;gap:6px;padding:8px 0;border-radius:10px;border:1px dashed var(--border-default);background:none;font-size:12px;color:var(--text-muted);cursor:pointer;font-family:inherit;">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
            Add a place
          </button>
        </div>
      </sc-if>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { tab: 'stats' };
  renderVals() {
    const isStats = this.state.tab === 'stats';
    return {
      isStats,
      statsBg: isStats ? 'var(--surface-sunken)' : 'transparent',
      statsFg: isStats ? 'var(--text-primary)' : 'var(--text-muted)',
      bucketBg: !isStats ? 'var(--surface-sunken)' : 'transparent',
      bucketFg: !isStats ? 'var(--text-primary)' : 'var(--text-muted)',
      setTabStats: () => this.setState({ tab: 'stats' }),
      setTabBucket: () => this.setState({ tab: 'bucket' }),
      toggleAdd: () => {},
    };
  }
}
</script>
</body>
</html>
