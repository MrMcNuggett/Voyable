<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<helmet>
  <link rel="stylesheet" href="_ds/voyable-design-system-20d63b1d-fb41-47b0-8049-741c2094f669/tokens/fonts.css">
  <link rel="stylesheet" href="_ds/voyable-design-system-20d63b1d-fb41-47b0-8049-741c2094f669/tokens/colors.css">
  <link rel="stylesheet" href="_ds/voyable-design-system-20d63b1d-fb41-47b0-8049-741c2094f669/tokens/typography.css">
  <link rel="stylesheet" href="_ds/voyable-design-system-20d63b1d-fb41-47b0-8049-741c2094f669/tokens/spacing.css">
  <link rel="stylesheet" href="_ds/voyable-design-system-20d63b1d-fb41-47b0-8049-741c2094f669/tokens/effects.css">
  <link rel="stylesheet" href="_ds/voyable-design-system-20d63b1d-fb41-47b0-8049-741c2094f669/styles.css">
  <script src="_ds/voyable-design-system-20d63b1d-fb41-47b0-8049-741c2094f669/_ds_bundle.js"></script>
  <style>
    html,body{margin:0;background:var(--surface-page);}
    *{box-sizing:border-box;}
    .mono{font-family:var(--font-mono);font-feature-settings:"tnum";}
  </style>
</helmet>

<div style="font-family:var(--font-sans);color:var(--text-primary);min-height:100vh;">
  <nav style="height:64px;display:flex;align-items:center;padding:0 24px;gap:10px;background:color-mix(in oklch, var(--surface-raised) 92%, transparent);backdrop-filter:blur(16px);border-bottom:1px solid var(--border-subtle);">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="11" fill="var(--petrol-500)"/><path d="M12 6c-2.2 0-4 1.7-4 4 0 3 4 8 4 8s4-5 4-8c0-2.3-1.8-4-4-4Zm0 5.5A1.5 1.5 0 1 1 12 8.5a1.5 1.5 0 0 1 0 3Z" fill="var(--stone-50)"/></svg>
    <span style="font-family:var(--font-display);font-weight:700;font-size:var(--text-xl);letter-spacing:-0.01em;">voyable</span>
  </nav>

  <div style="max-width:820px;margin:0 auto;padding:32px 28px 80px;">

    <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:18px;">
      <div>
        <h1 style="margin:0;font-family:var(--font-display);font-size:22px;font-weight:700;letter-spacing:-0.01em;">Packing list</h1>
        <p style="margin:2px 0 0;font-size:13px;color:var(--text-muted);">Portugal Road Trip · 8 of 14 packed</p>
      </div>
      <div style="display:flex;gap:8px;">
        <button style="display:flex;align-items:center;gap:6px;padding:7px 13px;border-radius:999px;border:1px solid var(--border-default);background:none;font-size:12px;font-weight:600;color:var(--text-muted);cursor:pointer;font-family:inherit;">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><path d="M12 15V3"/></svg>
          Import
        </button>
        <button style="display:flex;align-items:center;gap:6px;padding:7px 13px;border-radius:999px;border:none;background:var(--accent-primary);color:var(--text-on-accent);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7h-9M14 17H5M17 3v8M7 13v8"/></svg>
          Apply template
        </button>
      </div>
    </div>

    <div style="display:flex;align-items:center;gap:14px;margin-bottom:24px;">
      <div style="display:flex;align-items:baseline;flex-shrink:0;">
        <span class="mono" style="font-size:24px;font-weight:700;">8</span><span style="font-size:14px;color:var(--text-muted);">/14</span>
      </div>
      <div style="flex:1;height:8px;border-radius:99px;background:var(--surface-sunken);overflow:hidden;">
        <div style="width:57%;height:100%;background:var(--accent-primary);border-radius:99px;"></div>
      </div>
      <span style="font-size:11px;font-weight:600;padding:3px 8px;border-radius:99px;background:var(--surface-sunken);color:var(--text-muted);flex-shrink:0;">57%</span>
    </div>

    <!-- Category: Clothing -->
    <div style="border:1px solid var(--border-subtle);border-radius:14px;background:var(--surface-raised);margin-bottom:10px;overflow:hidden;">
      <div style="display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--border-subtle);">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--text-faint)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
        <span style="width:9px;height:9px;border-radius:50%;background:var(--petrol-400);flex-shrink:0;"></span>
        <span style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:var(--text-secondary);">Clothing</span>
        <div style="flex:1;"></div>
        <span style="font-size:10.5px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--surface-sunken);color:var(--text-muted);">3/5</span>
      </div>
      <div style="display:flex;flex-direction:column;">
        <label style="display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--border-subtle);cursor:pointer;">
          <span style="width:18px;height:18px;border-radius:5px;background:var(--accent-primary);display:flex;align-items:center;justify-content:center;flex-shrink:0;"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></span>
          <span style="flex:1;font-size:13px;color:var(--text-faint);text-decoration:line-through;">Rain jacket</span>
        </label>
        <label style="display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--border-subtle);cursor:pointer;">
          <span style="width:18px;height:18px;border-radius:5px;background:var(--accent-primary);display:flex;align-items:center;justify-content:center;flex-shrink:0;"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></span>
          <span style="flex:1;font-size:13px;color:var(--text-faint);text-decoration:line-through;">Walking shoes</span>
        </label>
        <label style="display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--border-subtle);cursor:pointer;">
          <span style="width:18px;height:18px;border-radius:5px;background:var(--accent-primary);display:flex;align-items:center;justify-content:center;flex-shrink:0;"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></span>
          <span style="flex:1;font-size:13px;color:var(--text-faint);text-decoration:line-through;">Swimsuit</span>
        </label>
        <label style="display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--border-subtle);cursor:pointer;">
          <span style="width:18px;height:18px;border-radius:5px;border:1.5px solid var(--border-default);flex-shrink:0;"></span>
          <span style="flex:1;font-size:13px;">Light sweater</span>
        </label>
        <label style="display:flex;align-items:center;gap:10px;padding:9px 14px;cursor:pointer;">
          <span style="width:18px;height:18px;border-radius:5px;border:1.5px solid var(--border-default);flex-shrink:0;"></span>
          <span style="flex:1;font-size:13px;">Sun hat</span>
        </label>
        <button style="display:flex;align-items:center;gap:5px;padding:8px 14px;border:none;background:none;font-size:12px;color:var(--text-muted);cursor:pointer;font-family:inherit;border-top:1px dashed var(--border-subtle);">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
          Add item
        </button>
      </div>
    </div>

    <!-- Category: Documents -->
    <div style="border:1px solid var(--border-subtle);border-radius:14px;background:var(--surface-raised);margin-bottom:10px;overflow:hidden;">
      <div style="display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--border-subtle);">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--text-faint)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
        <span style="width:9px;height:9px;border-radius:50%;background:var(--olive-400);flex-shrink:0;"></span>
        <span style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:var(--text-secondary);">Documents</span>
        <div style="flex:1;"></div>
        <div style="display:inline-flex;margin-right:4px;">
          <div style="width:18px;height:18px;border-radius:50%;background:var(--petrol-400);border:1.5px solid var(--surface-raised);color:white;font-size:8px;font-weight:700;display:flex;align-items:center;justify-content:center;">JS</div>
        </div>
        <span style="font-size:10.5px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--state-success-subtle);color:var(--success-700);">3/3</span>
      </div>
      <div style="display:flex;flex-direction:column;">
        <label style="display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--border-subtle);cursor:pointer;">
          <span style="width:18px;height:18px;border-radius:5px;background:var(--accent-primary);display:flex;align-items:center;justify-content:center;flex-shrink:0;"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></span>
          <span style="flex:1;font-size:13px;color:var(--text-faint);text-decoration:line-through;">Passport</span>
        </label>
        <label style="display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--border-subtle);cursor:pointer;">
          <span style="width:18px;height:18px;border-radius:5px;background:var(--accent-primary);display:flex;align-items:center;justify-content:center;flex-shrink:0;"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></span>
          <span style="flex:1;font-size:13px;color:var(--text-faint);text-decoration:line-through;">Travel insurance</span>
        </label>
        <label style="display:flex;align-items:center;gap:10px;padding:9px 14px;cursor:pointer;">
          <span style="width:18px;height:18px;border-radius:5px;background:var(--accent-primary);display:flex;align-items:center;justify-content:center;flex-shrink:0;"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></span>
          <span style="flex:1;font-size:13px;color:var(--text-faint);text-decoration:line-through;">Booking confirmations</span>
        </label>
      </div>
    </div>

    <button style="width:100%;display:flex;align-items:center;justify-content:center;gap:6px;padding:11px;border-radius:12px;border:1.5px dashed var(--border-default);background:none;font-size:13px;color:var(--text-muted);cursor:pointer;font-family:inherit;">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M12 18v-6M9 15h6"/></svg>
      Add category
    </button>
  </div>
</div>

</x-dc>
</body>
</html>
